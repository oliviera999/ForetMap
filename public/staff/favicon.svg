<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plan des personnels (proflyautey). Même motif que le plan public (public/plan/favicon.svg)
  pour rester reconnaissable, en fond brun-laiton plutôt que bleu marine, et avec un cadenas :
  deux onglets ouverts côte à côte doivent se distinguer d'un coup d'œil, et rien ne doit
  laisser croire qu'on lit le plan public quand on lit des consignes internes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#5a3a12"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(3.84 3.2) scale(1)">
    <path stroke="#ffffff" stroke-width="1.35" d="M4 22 L10 6 L16 22"/>
    <path stroke="#d8c08c" stroke-width="1.1" d="M6 22 L12 8 L18 22"/>
    <path stroke="#b08e4a" stroke-width="1" d="M8 22 L14 10 L20 22"/>
    <path stroke="#ffffff" stroke-width="1.35" d="M12 22 L18 6 L24 22"/>
    <path stroke="#d8c08c" stroke-width="1.1" d="M14 22 L20 8 L26 22"/>
  </g>
  <g transform="translate(19 18)">
    <rect x="0" y="4" width="10" height="8" rx="1.6" fill="#ffffff"/>
    <path d="M2.4 4 V2.4 a2.6 2.6 0 0 1 5.2 0 V4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="5" cy="8" r="1.3" fill="#5a3a12"/>
  </g>
</svg>
