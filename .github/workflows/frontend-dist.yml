name: Frontend dist

# Depuis la bascule `dist-artifact` (26/09/2026), `dist/` n'est plus versionné : la CI le
# construit et le publie sur la branche `dist-artifact/main` (`dist-publish.yml`), le cron le
# récupère (docs/DEPLOY_DIST_ARTIFACT.md). Ce workflow ne recommite donc plus `dist/`.
#
# Il garde deux rôles :
#   - vérifier que le build de production passe sur chaque PR (un build cassé bloquerait la
#     publication de l'artefact, donc le déploiement) ;
#   - garantir que les miroirs CJS encore versionnés (`lib/visit-pack/`, `lib/gl-pack/`,
#     `lib/term-autolink/`), requis au runtime par l'API qui tourne sans `src/`, correspondent
#     aux sources. Sur une PR du dépôt, une dérive est recommitée automatiquement ; sur une PR
#     de fork ou un push `main`, elle fait échouer le job.
#
# Le job garde le nom `dist` : c'est celui que la protection de branche attend.
#
# Audit sécurité du 30/09/2026 (CS5) — le code d'une PR (scripts `postinstall`, plugins Vite,
# dépendance compromise) s'exécutait avec un jeton capable de pousser. Désormais :
#   - le job `dist` (build) tourne en `contents: read`, checkout sans identifiants persistés
#     (`persist-credentials: false`) ; en cas de dérive il publie seulement un **patch** en
#     artefact ;
#   - le job `dist-push-mirrors` porte seul `contents: write` : il n'exécute aucun code de la
#     PR (ni `npm ci`, ni build), télécharge le patch, vérifie qu'il ne touche QUE les miroirs,
#     puis le commite et le pousse.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Par défaut : lecture seule. Seul `dist-push-mirrors` élève ses droits.
permissions:
  contents: read

# Évite deux rebuilds concurrents sur la même réf (le second annule le premier).
concurrency:
  group: frontend-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sur une PR : on checkout la *branche source* (et non la merge-ref détachée) pour
          # que le patch s'applique tel quel au commit de tête ; sur push, réf par défaut.
          ref: ${{ github.head_ref }}
          # Aucun jeton laissé dans `.git/config` : le build de la PR ne peut pas pousser.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build de production + miroirs (npm run build)
        run: npm run build

      - name: Détecter une dérive des miroirs CJS
        id: drift
        run: |
          if git diff --quiet -- lib/visit-pack/ lib/gl-pack/ lib/term-autolink/; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Miroirs CJS à jour."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- lib/visit-pack/ lib/gl-pack/ lib/term-autolink/
            git diff --binary -- lib/visit-pack/ lib/gl-pack/ lib/term-autolink/ > mirrors.patch
          fi

      # --- PR du dépôt → patch transmis au job de push (qui n'exécute pas le code de la PR) ---
      - name: Publier le patch des miroirs (PR du dépôt)
        if: >-
          steps.drift.outputs.drift == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirrors-patch
          path: mirrors.patch
          retention-days: 1
          if-no-files-found: error

      # --- Garde-fou bloquant (push main, ou PR de fork sans auto-commit possible) ---
      - name: Garde-fou miroirs à jour
        if: >-
          steps.drift.outputs.drift == 'true' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::Miroirs CJS périmés. Lance 'npm run build' (ou 'npm run sync:visit-pack-lib', 'npm run sync:gl-pack-lib') puis recommite lib/visit-pack/ + lib/gl-pack/ + lib/term-autolink/."
          exit 1

  # Recommit automatique des miroirs régénérés (PR du dépôt uniquement). Aucun `npm`, aucun
  # script de la PR : checkout, `git apply` d'un patch vérifié, commit, push.
  dist-push-mirrors:
    needs: dist
    if: >-
      needs.dist.outputs.drift == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      # `gh` est préinstallé sur les runners GitHub : pas d'action tierce de plus à épingler.
      - name: Télécharger le patch des miroirs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n mirrors-patch -D "$RUNNER_TEMP/mirrors"

      - name: Appliquer le patch (miroirs seulement)
        run: |
          PATCH="$RUNNER_TEMP/mirrors/mirrors.patch"
          # Le patch vient d'un job qui a exécuté le code de la PR : tout chemin hors des trois
          # miroirs est refusé avant application.
          if git apply --numstat "$PATCH" | awk '{print $3}' | grep -vE '^lib/(visit-pack|gl-pack|term-autolink)/'; then
            echo "::error::Le patch des miroirs touche un chemin hors lib/visit-pack/, lib/gl-pack/, lib/term-autolink/."
            exit 1
          fi
          git apply --index "$PATCH"

      - name: Auto-commit des miroirs (PR du dépôt)
        # Le nom de branche passe par l'environnement, jamais interpolé dans le script : un nom
        # piégé (`$(...)`, `"; …`) exécuterait sinon du code avec `contents: write`.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(build): régénère les miroirs CJS (auto) [skip ci]"
          # Le push avec GITHUB_TOKEN ne re-déclenche pas de workflow (anti-boucle).
          git push origin "HEAD:refs/heads/${HEAD_REF}"
