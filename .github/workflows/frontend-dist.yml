name: Frontend dist

# Depuis la bascule `dist-artifact` (26/09/2026), `dist/` n'est plus versionné : la CI le
# construit et le publie sur la branche `dist-artifact/main` (`dist-publish.yml`), le cron le
# récupère (docs/DEPLOY_DIST_ARTIFACT.md). Ce workflow ne recommite donc plus `dist/`.
#
# Il garde deux rôles :
#   - vérifier que le build de production passe sur chaque PR (un build cassé bloquerait la
#     publication de l'artefact, donc le déploiement) ;
#   - garantir que les miroirs CJS encore versionnés (`lib/visit-pack/`, `lib/gl-pack/`,
#     `lib/term-autolink/`), requis au runtime par l'API qui tourne sans `src/`, correspondent
#     aux sources. Sur une PR du dépôt, une dérive est recommitée automatiquement ; sur une PR
#     de fork ou un push `main`, elle fait échouer le job.
#
# Le job garde le nom `dist` : c'est celui que la protection de branche attend.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: write

# Évite deux rebuilds concurrents sur la même réf (le second annule le premier).
concurrency:
  group: frontend-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sur une PR : on checkout la *branche source* (et non la merge-ref
          # détachée) pour pouvoir recommiter ; sur push, réf par défaut.
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build de production + miroirs (npm run build)
        run: npm run build

      - name: Détecter une dérive des miroirs CJS
        id: drift
        run: |
          if git diff --quiet -- lib/visit-pack/ lib/gl-pack/ lib/term-autolink/; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Miroirs CJS à jour."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- lib/visit-pack/ lib/gl-pack/ lib/term-autolink/
          fi

      # --- PR du dépôt → recommit automatique des miroirs régénérés ---
      - name: Auto-commit des miroirs (PR du dépôt)
        if: >-
          steps.drift.outputs.drift == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/visit-pack/ lib/gl-pack/ lib/term-autolink/
          git commit -m "chore(build): régénère les miroirs CJS (auto) [skip ci]"
          # Le push avec GITHUB_TOKEN ne re-déclenche pas de workflow (anti-boucle).
          git push origin "HEAD:${{ github.head_ref }}"

      # --- Garde-fou bloquant (push main, ou PR de fork sans auto-commit possible) ---
      - name: Garde-fou miroirs à jour
        if: >-
          steps.drift.outputs.drift == 'true' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::Miroirs CJS périmés. Lance 'npm run build' (ou 'npm run sync:visit-pack-lib', 'npm run sync:gl-pack-lib') puis recommite lib/visit-pack/ + lib/gl-pack/ + lib/term-autolink/."
          exit 1
