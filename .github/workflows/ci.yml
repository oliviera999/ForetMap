name: CI

# Validation des **pull requests** — et d'elles seules. Le dépôt est privé (plan Free :
# 2 000 min Actions/mois, facturées par job arrondi à la minute) ; architecture et chiffres :
# docs/EXPLOITATION.md § 11.2. En bref :
#   - aucun run sur `main` : la PR fusionnée a déjà passé ce fichier, et ce qui doit tourner à
#     la fusion (numéros de migration, bump, tag, publication de l'artefact) vit dans
#     release.yml, en un seul job ;
#   - `concurrency` : un nouveau push sur la même PR annule le run en cours ;
#   - PR en brouillon : aucun job (« skipped ») — la CI part au passage « Ready for review »
#     (`ready_for_review`) ou à la main (Actions → CI → Run workflow) ;
#   - PR de documentation seule (audits, `.cursor/`, `.claude/`…, cf.
#     scripts/ci-change-scope.js) : `quality` sans Vitest ;
#   - suite e2e complète (informative) : e2e-full.yml, à la demande.

on:
  pull_request:
    branches: [main, master]
    # `ready_for_review` : une PR sortie du brouillon lance sa première CI.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Lecture seule : ce workflow ne pousse rien. Sans bloc explicite, le jeton hérite des droits
# par défaut du dépôt, potentiellement en écriture.
permissions:
  contents: read

# Un push qui en suit un autre rend le run précédent caduc : on l'annule au lieu de le payer.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Décide de l'étendue du run. Coûte une minute facturée, en économise ~40 sur une PR de doc.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-change-scope.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Étendue du run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            pull_request)
              # Liste des fichiers de la PR (API, pas besoin d'historique git). En cas d'échec,
              # `ci-change-scope.js` reçoit une liste vide et répond « complète » par prudence.
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' \
                > "$RUNNER_TEMP/files.txt" || : > "$RUNNER_TEMP/files.txt"
              echo "Fichiers modifiés : $(wc -l < "$RUNNER_TEMP/files.txt")"
              node scripts/ci-change-scope.js < "$RUNNER_TEMP/files.txt" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # workflow_dispatch : lancement manuel sur une branche → CI complète.
              echo "full=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
          cat "$GITHUB_OUTPUT"

  # Lint / format / tests UI : aucun besoin de MySQL → job parallèle sans service,
  # qui ne paie ni le health-check MariaDB (~40 s) ni db:init.
  quality:
    needs: changes
    runs-on: ubuntu-latest
    # Même garde-fou que le job `test` ci-dessous (run sain : ~5 min).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Dumps, hachages de mots de passe, clés et jetons (scripts/check-sensitive-files.js) :
      # Node seul, sans dépendance, donc avant `npm ci`. Filet de la CI derrière le hook
      # pre-commit, contournable par `--no-verify`. Les PR en brouillon ne passent pas ici :
      # le hook reste la seule protection AVANT la publication sur GitHub.
      - name: Garde-fou données sensibles
        run: node scripts/check-sensitive-files.js --all

      - name: Install dependencies
        run: npm ci

      # Numéros de migration : le contrôle vit aussi dans `npm test` (job `test`), mais il y
      # est noyé derrière ~18 min de suite backend et de service MariaDB. Or une collision de
      # numéros ne casse pas un test : elle casse le **démarrage** de l'application
      # (`assertNoNewDuplicateMigrationNumbers` refuse tout doublon hors 021/037 hérités).
      # Le rejouer ici le fait tomber en une minute, sans base — et il n'est pas redondant en
      # pratique : c'est un contrôle de l'arbre *fusionné*, donc sa valeur dépend de sa
      # fraîcheur. Cas vécu le 26/08 : deux PR ouvertes en parallèle apportaient chacune un
      # `201_`, aucune des deux n'étant en collision au moment de sa propre CI.
      - name: Vérifier l'unicité des numéros de migration
        run: node --test --test-force-exit tests/migrations-unique-numbers.test.js

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      # ~2 min depuis le pool `vmThreads` (vitest.config.js), ~12 min avant. Sauté sur une PR
      # de documentation seule (cf. job `changes`).
      - name: Run UI tests (Vitest)
        if: needs.changes.outputs.full == 'true'
        run: npm run test:ui

      # Vulnérabilités connues des dépendances de production, niveau `high` et plus.
      # Bloquant depuis l'audit sécurité du 30/09/2026 (CS5 / AP1) : informative, l'étape avait
      # laissé passer `engine.io@6.6.9` (déni de service sans compte). Les `moderate` restent
      # suivies par Dependabot.
      - name: Audit des dépendances (npm audit, bloquant)
        run: npm audit --omit=dev --audit-level=high

  # Conserve le nom `test` : c'est le check requis côté protections de branche. Inclut aussi le
  # contrôle du build de production (ex-frontend-dist.yml) et le corpus pédagogique (ex-job
  # `contenu`) : un seul `npm ci`, un seul MariaDB, un seul `db:init` par run.
  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Sans borne, une étape qui se fige consomme les 6 h du délai GitHub par défaut,
    # puis le check requis termine en `cancelled` — indiscernable d'un vrai échec, et
    # six heures de retard pour la PR (vécu le 19/08/2026 : blocage sur l'installation
    # du navigateur Playwright). Un run sain tient en ~15 min ; 30 laisse de la marge
    # tout en faisant échouer vite.
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: foretmap_test
      DB_USER: root
      DB_PASS: ''
      JWT_SECRET: 'ci-test-secret-not-for-production'
    services:
      mysql:
        image: mariadb:11.4.10
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: foretmap_test
        ports:
          - 3306:3306
        # `--health-start-period=40s` : laisse à MariaDB 11.4 le temps de son
        # init InnoDB à froid avant que les échecs de health-check ne comptent
        # (sinon le step « Initialize containers » échoue par intermittence en
        # ~55s, 3×10s de retries trop justes). retries relevé à 5 par sécurité.
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5 --health-start-period=40s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database
        id: dbinit
        run: npm run db:init

      # `npm test` et non plus `test:coverage` (10/10/2026) : la couverture n'était lue par
      # rien (ni envoi, ni seuil) et coûtait +27 % sur la suite (917 s → 1 162 s en local),
      # soit ~2 min facturées par run. Elle reste disponible en local : `npm run test:coverage`.
      - name: Run backend tests
        run: npm test

      # Corpus pédagogique (`tests/content/`) : assertions sur les **données** semées par les
      # migrations — espèces, liaisons trophiques, rattachements QCM. Étape à son propre nom
      # (un contenu incohérent doit tomber sans se confondre avec un échec de code, cf. le
      # 09/09 : `pedago-garden-auxiliaires`, migration 230), qui tourne **même si** la suite
      # backend a échoué. Ex-job `contenu` : il refaisait `npm ci`, MariaDB et `db:init` pour
      # 3 s de tests. Même ordre que `npm run test:all` (backend, puis contenu).
      - name: Contenu pédagogique (tests/content)
        if: ${{ !cancelled() && steps.dbinit.outcome == 'success' }}
        run: npm run test:content

      - name: Build frontend (Vite)
        run: npm run build

      # Miroirs CJS (`lib/visit-pack/`, `lib/gl-pack/`, `lib/term-autolink/`) : requis au
      # runtime par l'API, qui tourne sans `src/` ; `npm run build` les régénère. Une dérive
      # veut dire qu'ils n'ont pas été recommités. Ex-workflow frontend-dist.yml, qui les
      # recommitait lui-même avec un jeton en écriture déclenché par une PR : la correction
      # revient désormais à l'auteur (agents compris), en une commande.
      - name: Miroirs CJS à jour
        run: |
          if ! git diff --quiet -- lib/visit-pack/ lib/gl-pack/ lib/term-autolink/; then
            git --no-pager diff --stat -- lib/visit-pack/ lib/gl-pack/ lib/term-autolink/
            echo "::error::Miroirs CJS périmés : lancer 'npm run build' puis recommiter lib/visit-pack/, lib/gl-pack/ et lib/term-autolink/."
            exit 1
          fi

      - name: Install Playwright browser
        # Téléchargement du navigateur + paquets système : la seule étape du job qui
        # dépende d'un réseau externe, et donc la seule à pouvoir rester suspendue.
        # Elle prend ~1 min quand tout va bien, mais un miroir apt lent l'a déjà fait
        # dépasser 10 min (30/09/2026) : 20 min laissent la marge sans masquer un blocage.
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium webkit

      - name: Start app server for e2e
        run: |
          nohup npm run start:e2e > /tmp/foretmap-server.log 2>&1 &
        env:
          # Le SPA `dist/` n'est servi QU'EN production (server.js : `serveDist =
          # NODE_ENV === 'production'`). En `test`, server.js sert `public/` (pas
          # de SPA) → boutons/onglets absents → toute la suite UI e2e échoue
          # (login « Créer un compte », nav GL, mascotte…). On aligne donc sur le
          # webServer Playwright local, lui aussi en production.
          NODE_ENV: production
          # Requis en production (lib/env.js) — cookie visite anonyme. Valeur de
          # test, identique au repli du webServer Playwright local.
          VISIT_COOKIE_SECRET: 'foretmap-e2e-visit-cookie-secret'
          # `start:e2e` pose déjà ce bypass via --foretmap-e2e-no-rate-limit ;
          # explicite ici pour mirror exact du webServer local.
          E2E_DISABLE_RATE_LIMIT: '1'
          # Compte admin de test. `lib/env.js` ne l'auto-sème QUE si les deux variables sont
          # présentes ; sans elles, aucun enseignant n'existe et les specs Plan qui appellent
          # `POST /api/auth/login` (calage géo de la carte via l'API admin) échouaient en 401
          # — pas sur ce qu'elles testent. Valeurs alignées sur les défauts des specs et du
          # helper `tests/helpers/adminAuth.js`.
          TEACHER_ADMIN_EMAIL: 'admin.test@foretmap.local'
          TEACHER_ADMIN_PASSWORD: 'admin1234'

      - name: Wait for app health
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Run Playwright Plan smoke (bloquant)
        # Coquille, parcours, position et cap en haut (projet `plan-mobile`) — filet court et
        # stable ; la suite e2e complète, informative, vit dans e2e-full.yml (à la demande).
        # Position et orientation y sont entrées après l'audit du 13 septembre (N1) : le
        # retournement des étiquettes sous « cap en haut » avait traversé la CI parce que le
        # seul scénario qui exerce la position n'était pas bloquant.
        run: npx playwright test --project=plan-mobile e2e/plan-mobile-shell.spec.js e2e/plan-routes-mode.spec.js e2e/plan-mobile-position.spec.js e2e/plan-mobile-orientation.spec.js
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Run Playwright Plan e-nov smoke (bloquant)
        # Plan e-nov (projet `enov-mobile`) : lieu étiqueté depuis la console, mis en avant,
        # listé par la puce « Innovations », fiche ouverte sur le texte e-nov.
        run: npx playwright test --project=enov-mobile e2e/enov-shell.spec.js
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Run Playwright mobile-webkit smoke (bloquant)
        # Audit navigation iPhone — WebKit ≠ Safari iOS, mais filet CSS/touch manquant avant.
        run: npx playwright test --project=mobile-webkit
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      # La suite e2e complète (informative, ~12 min, non bloquante) ne tourne plus ici : elle
      # coûtait un tiers du job sans jamais bloquer, et ses rapports (captures, traces) avaient
      # rempli le quota de stockage d'artefacts du plan Free — l'envoi échouait, rendant le
      # job rouge à chaque run. Elle vit dans e2e-full.yml, à lancer à la main.
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/foretmap-server.log || true
