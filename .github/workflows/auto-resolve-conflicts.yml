name: Auto-resolve merge conflicts

# Vérifie et corrige automatiquement les conflits de merge des PR ouvertes vers
# `main`. Résout sans risque les conflits récurrents (CHANGELOG.md par union,
# bumps de version package.json/package-lock.json) et pousse la résolution ;
# signale (label `merge-conflict` + commentaire) les conflits de code qui
# nécessitent une intervention humaine. Voir scripts/auto-resolve-conflicts.js.

on:
  # **À la demande seulement** depuis le 10/10/2026. Le déclencheur `push` sur main et le cron
  # toutes les 6 h coûtaient ~45 min Actions/semaine (dépôt privé), et surtout : poussé avec
  # `AUTO_MERGE_PAT`, chaque résolution relançait la CI complète (~20 min) de la PR touchée, à
  # chaque fusion. Or les sessions Claude Code et Cursor résolvent déjà les conflits de leurs
  # propres PR (fusion de `main` dans la branche). Reste utile pour une PR humaine en retard :
  # Actions → « Auto-resolve merge conflicts » → Run workflow. Cf. docs/EXPLOITATION.md § 11.2.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation (aucune écriture ni push)'
        type: boolean
        default: false
      include_drafts:
        description: 'Traiter aussi les PR en brouillon'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Une seule exécution à la fois : évite des pushs concurrents sur les branches.
concurrency:
  group: auto-resolve-conflicts
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # AUTO_MERGE_PAT (optionnel) : un PAT permet de RE-DÉCLENCHER la CI sur
          # la branche de PR après push (le GITHUB_TOKEN par défaut ne le fait
          # pas). À défaut, la résolution est poussée sans relancer la CI.
          # Portée minimale attendue (audit sécurité du 30/09/2026, CS5) : jeton FIN
          # (fine-grained), limité à CE SEUL dépôt, avec uniquement les permissions
          # « Contents: Read and write » et « Pull requests: Read and write », et une
          # date d'expiration. Jamais un PAT classique `repo` (accès à tous les dépôts).
          token: ${{ secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Résolution automatique des conflits
        run: node scripts/auto-resolve-conflicts.js
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTO_RESOLVE_BASE: main
          AUTO_RESOLVE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          AUTO_RESOLVE_INCLUDE_DRAFTS: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_drafts) && '1' || '0' }}
